<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Roy Bari Admin — Change Password"
    >

    <title>
        Roy Bari — Change Password
    </title>


    <!-- =====================================================
         FONT AWESOME
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         ADMIN CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="./css/admin.css"
    >


</head>


<body class="admin-page">


    <!-- =====================================================
         CHANGE PASSWORD
         ===================================================== -->

    <main class="change-password-page">


        <section class="change-password-card">


            <!-- =================================================
                 HEADER
                 ================================================= -->

            <div class="change-password-header">


                <div class="change-password-icon">

                    <i class="fa-solid fa-lock"></i>

                </div>


                <div>

                    <h1>
                        Change Password
                    </h1>

                    <p>
                        Update your admin account password
                    </p>

                </div>


            </div>


            <!-- =================================================
                 MESSAGE
                 ================================================= -->

            <div
                id="password-message"
                class="password-message"
                hidden
            ></div>


            <!-- =================================================
                 FORM
                 ================================================= -->

            <form
                id="change-password-form"
                autocomplete="off"
            >


                <!-- =============================================
                     CURRENT PASSWORD
                     ============================================= -->

                <div class="password-field">


                    <label for="current-password">

                        Current Password

                    </label>


                    <div class="password-input-wrap">


                        <i
                            class="fa-solid fa-key"
                        ></i>


                        <input
                            type="password"
                            id="current-password"
                            name="current-password"
                            placeholder="Enter current password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            data-target="current-password"
                            aria-label="Show password"
                        >

                            <i
                                class="fa-regular fa-eye"
                            ></i>

                        </button>


                    </div>


                </div>


                <!-- =============================================
                     NEW PASSWORD
                     ============================================= -->

                <div class="password-field">


                    <label for="new-password">

                        New Password

                    </label>


                    <div class="password-input-wrap">


                        <i
                            class="fa-solid fa-lock"
                        ></i>


                        <input
                            type="password"
                            id="new-password"
                            name="new-password"
                            placeholder="Enter new password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            data-target="new-password"
                            aria-label="Show password"
                        >

                            <i
                                class="fa-regular fa-eye"
                            ></i>

                        </button>


                    </div>


                    <div class="password-hint">

                        <i
                            class="fa-solid fa-circle-info"
                        ></i>

                        Password must contain at least 6 characters.

                    </div>


                </div>


                <!-- =============================================
                     CONFIRM PASSWORD
                     ============================================= -->

                <div class="password-field">


                    <label for="confirm-password">

                        Confirm New Password

                    </label>


                    <div class="password-input-wrap">


                        <i
                            class="fa-solid fa-shield-halved"
                        ></i>


                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm new password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirm-password"
                            aria-label="Show password"
                        >

                            <i
                                class="fa-regular fa-eye"
                            ></i>

                        </button>


                    </div>


                </div>


                <!-- =================================================
                     PASSWORD STRENGTH
                     ================================================= -->

                <div
                    id="password-strength"
                    class="password-strength"
                    hidden
                >


                    <div class="strength-bar">

                        <span
                            id="strength-progress"
                        ></span>

                    </div>


                    <span
                        id="strength-text"
                    >
                        Password strength
                    </span>


                </div>


                <!-- =================================================
                     ACTIONS
                     ================================================= -->

                <div class="change-password-actions">


                    <a
                        href="./dashboard.html"
                        class="cancel-password-btn"
                    >

                        <i
                            class="fa-solid fa-arrow-left"
                        ></i>

                        Cancel

                    </a>


                    <button
                        type="submit"
                        id="change-password-btn"
                        class="change-password-btn"
                    >

                        <i
                            class="fa-solid fa-key"
                        ></i>

                        <span>
                            Change Password
                        </span>

                    </button>


                </div>


            </form>


            <!-- =================================================
                 SECURITY NOTICE
                 ================================================= -->

            <div class="password-security-note">


                <i
                    class="fa-solid fa-shield-halved"
                ></i>


                <div>


                    <strong>
                        Security Notice
                    </strong>


                    <p>
                        Your current password is required
                        before your new password can be saved.
                    </p>


                </div>


            </div>


        </section>


    </main>


    <!-- =====================================================
         CHANGE PASSWORD JS
         ===================================================== -->

    <script
        type="module"
        src="./js/change-password.js"
    ></script>


</body>

</html>
