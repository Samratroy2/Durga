<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Roy Bari Admin Panel"
    >

    <title>
        Roy Bari — Admin Login
    </title>

    <link
        rel="stylesheet"
        href="./css/admin.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>

        /* =====================================================
           LOGIN UI IMPROVEMENTS
           ===================================================== */

        .login-card {
            position: relative;
        }


        .login-heading h1 {
            margin-bottom: 10px;
        }


        .login-heading p {
            max-width: 360px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }


        /* =====================================================
           INPUT WRAPPER
           ===================================================== */

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }


        .input-wrapper input {
            width: 100%;
            box-sizing: border-box;
            padding-right: 52px;
        }


        .input-icon {
            pointer-events: none;
        }


        /* =====================================================
           PASSWORD TOGGLE
           ===================================================== */

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);

            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            background: transparent;

            color: #765237;

            font-size: 17px;

            cursor: pointer;

            border-radius: 7px;

            transition:
                background .2s ease,
                color .2s ease,
                transform .2s ease;
        }


        .password-toggle:hover {
            background: #f4ede5;
            color: #553822;
        }


        .password-toggle:active {
            transform:
                translateY(-50%)
                scale(.94);
        }


        .password-toggle:focus-visible {
            outline: 2px solid #8a6140;
            outline-offset: 2px;
        }


        /* =====================================================
           LOGIN BUTTON
           ===================================================== */

        .primary-button {
            position: relative;
            overflow: hidden;
        }


        .primary-button .button-arrow {
            margin-left: 8px;
            transition: transform .2s ease;
        }


        .primary-button:hover .button-arrow {
            transform: translateX(4px);
        }


        /* =====================================================
           LOGIN MESSAGE
           ===================================================== */

        .login-page .message {
            min-height: 20px;
            margin-top: 12px;
            text-align: center;
            font-size: 13px;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .login-footer {
            margin-top: 28px;
        }


        .login-footer span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .login-card {
                width: calc(100% - 32px);
                box-sizing: border-box;
            }


            .login-heading h1 {
                font-size: 32px;
            }


            .login-heading p {
                font-size: 13px;
            }

        }

    </style>

</head>


<body class="login-page">


    <!-- =====================================================
         BACKGROUND DECORATION
         ===================================================== -->

    <div class="login-decoration decoration-one"></div>

    <div class="login-decoration decoration-two"></div>



    <!-- =====================================================
         LOGIN WRAPPER
         ===================================================== -->

    <main class="login-wrapper">


        <section class="login-card">


            <!-- =================================================
                 LOGO
                 ================================================= -->

            <div class="login-logo">

                <div class="logo-symbol">
                    🪔
                </div>

            </div>



            <!-- =================================================
                 HEADING
                 ================================================= -->

            <div class="login-heading">

                <span class="login-label">
                    ROY BARI
                </span>

                <h1>
                    Admin Panel
                </h1>

                <p>
                    Manage your family heritage,
                    traditions and archives.
                </p>

            </div>



            <!-- =================================================
                 LOGIN FORM
                 ================================================= -->

            <form id="loginForm">


                <!-- =================================================
                     EMAIL
                     ================================================= -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>


                    <div class="input-wrapper">


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>



                <!-- =================================================
                     PASSWORD
                     ================================================= -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="input-wrapper">


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <!-- SHOW / HIDE PASSWORD -->

                        <button
                            type="button"
                            id="passwordToggle"
                            class="password-toggle"
                            aria-label="Show password"
                            aria-pressed="false"
                            title="Show password"
                        >

                            👁

                        </button>

                    </div>

                </div>



                <!-- =================================================
                     LOGIN BUTTON
                     ================================================= -->

                <button
                    type="submit"
                    id="loginButton"
                    class="primary-button"
                >

                    <span id="loginButtonText">
                        Login
                    </span>
                </button>



                <!-- =================================================
                     MESSAGE
                     ================================================= -->

                <p
                    id="loginMessage"
                    class="message"
                ></p>


            </form>



            <!-- =================================================
                 FOOTER
                 ================================================= -->

            <div class="login-footer">

                <span>
                    🔐 Secure administrator access
                </span>

            </div>


        </section>



        <!-- =================================================
             BRAND
             ================================================= -->

        <p class="login-brand">

            © Roy Bari · Preserving generations of tradition

        </p>


    </main>



    <!-- =====================================================
         LOGIN JAVASCRIPT
         ===================================================== -->

    <script
        type="module"
        src="./js/login.js"
    ></script>


    <!-- =====================================================
         PASSWORD SHOW / HIDE
         ===================================================== -->

    <script>

        const passwordInput =
            document.getElementById(
                "password"
            );


        const passwordToggle =
            document.getElementById(
                "passwordToggle"
            );


        if (
            passwordInput &&
            passwordToggle
        ) {

            passwordToggle.addEventListener(
                "click",
                () => {

                    const isPassword =
                        passwordInput.type ===
                        "password";


                    if (isPassword) {

                        passwordInput.type =
                            "text";

                        passwordToggle.textContent =
                            "🙈";

                        passwordToggle.setAttribute(
                            "aria-label",
                            "Hide password"
                        );

                        passwordToggle.setAttribute(
                            "title",
                            "Hide password"
                        );

                        passwordToggle.setAttribute(
                            "aria-pressed",
                            "true"
                        );

                    }

                    else {

                        passwordInput.type =
                            "password";

                        passwordToggle.textContent =
                            "👁";

                        passwordToggle.setAttribute(
                            "aria-label",
                            "Show password"
                        );

                        passwordToggle.setAttribute(
                            "title",
                            "Show password"
                        );

                        passwordToggle.setAttribute(
                            "aria-pressed",
                            "false"
                        );

                    }

                }
            );

        }

    </script>


</body>

</html>
